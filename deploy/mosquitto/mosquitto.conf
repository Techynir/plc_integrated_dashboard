# Mosquitto 2.0 + go-auth — PLC Dashboard broker
#
# Logins and topic permissions are NOT in this file: every connection and every
# publish/subscribe is checked against PostgreSQL (tables mqtt_accounts, mqtt_acls)
# by the go-auth plugin. Its settings, including the database login, are generated
# on each deploy by the init job into /mosquitto/conf.d/go-auth.conf.
allow_anonymous false
include_dir /mosquitto/conf.d

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Queue up to 100k QoS 1 messages for the ingestor's persistent session
# while it restarts.
max_queued_messages 100000
max_inflight_messages 100
max_packet_size 65536
max_keepalive 300

# Internal listener: services on the Docker network. Published to the host
# only on 127.0.0.1 (see docker-compose.yml).
listener 1883
protocol mqtt

# Public listener for PLCs: TLS 1.2+ with the self-generated CA (/certs).
listener 8883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
tls_version tlsv1.2

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
